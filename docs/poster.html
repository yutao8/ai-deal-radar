<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 优惠雷达 · 分页预览</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e8e6e1}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;color:#221f19;
     --w:1080px;--h:1440px;--pad:78px;--ink:#221f19;--sub:#8b8272;--line:#e6ddcd;
     --bg:#fbf8f2;--card:#fff;--hot:#d8422f;--warn:#c8811a;--cool:#39707c;--kick:#a89f8c}
body.tpl-dy{--h:1920px;--pad:88px;--bg:#0d0d10;--ink:#f7f7f5;--sub:#8d8d93;--line:#24242b;
     --card:#15151a;--hot:#ff5f4d;--warn:#ffc247;--cool:#2ee6a8;--kick:#5c5c66}
body.tpl-list{--pad:72px;--bg:#ffffff;--ink:#141414;--sub:#7a7a7a;--line:#e8e8e8;
     --card:#fafafa;--hot:#e0342a;--warn:#b8741a;--cool:#2f6a76;--kick:#9b9b9b}

#stage{display:flex;flex-direction:column;align-items:center;gap:34px;padding:34px 0 60px}
body.clean #stage{padding:0;gap:0}
body.all #stage{gap:26px}

.pg{width:var(--w);height:var(--h);background:var(--bg);color:var(--ink);
    position:relative;overflow:hidden;display:none;flex-direction:column;
    padding:var(--pad);transform-origin:top center}
.pg.on{display:flex}
body.all .pg{display:flex}

/* 封面 */
.cv{justify-content:space-between}
.cv .top{display:flex;justify-content:space-between;align-items:baseline;
         font-size:22px;letter-spacing:.42em;color:var(--kick);font-weight:700;text-transform:uppercase}
.cv .mid{margin-top:auto;margin-bottom:36px}
.cv h1{font-family:"Songti SC","SimSun",Georgia,serif;font-size:150px;line-height:1.02;
       font-weight:800;letter-spacing:-4px}
.cv h1 em{font-style:normal;color:var(--hot)}
.cv .sub{margin-top:34px;font-size:38px;line-height:1.5;color:var(--sub);max-width:820px}
.cv .sub b{color:var(--ink)}
.cv .rule{height:3px;background:var(--ink);margin:44px 0 40px;opacity:.9}
.cv .nums{display:flex}
.cv .n{flex:1}
.cv .n+.n{border-left:1px solid var(--line);padding-left:44px}
.cv .n b{display:block;font-size:74px;font-weight:800;line-height:1;letter-spacing:-2px}
.cv .n span{display:block;font-size:23px;color:var(--sub);margin-top:14px;letter-spacing:.08em}
.cv .n.h b{color:var(--hot)}.cv .n.w b{color:var(--warn)}.cv .n.c b{color:var(--cool)}
.cv .bot{display:flex;justify-content:space-between;align-items:flex-end;
         font-size:24px;color:var(--sub);letter-spacing:.04em}
.peek{border-top:1px solid var(--line);padding-top:30px}
.peek .ph{font-size:22px;letter-spacing:.3em;color:var(--kick);font-weight:700;margin-bottom:8px}
.peek .pi{display:flex;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.peek .pi:last-child{border-bottom:none}
.peek .pk{font-size:24px;color:var(--hot);font-weight:800;flex:none;width:64px}
.peek .pt{font-size:31px;font-weight:700;line-height:1.35;flex:1;min-width:0;
          display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.peek .pd{font-size:23px;color:var(--sub);flex:none}

/* 条目页 */
.phead{display:flex;justify-content:space-between;align-items:center;
       padding-bottom:26px;border-bottom:3px solid var(--ink)}
.phead .l{font-size:34px;font-weight:800;letter-spacing:.06em}
.phead .r{font-size:24px;color:var(--kick);letter-spacing:.16em;font-variant-numeric:tabular-nums}
.list{margin-top:10px;flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.row{display:flex;gap:30px;padding:40px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row:last-child{border-bottom:none}
.idx{flex:none;width:96px;font-family:"Songti SC","SimSun",Georgia,serif;font-size:52px;
     font-weight:800;color:var(--kick);line-height:1.1;letter-spacing:-1px}
.rmain{flex:1;min-width:0}
.rt{font-size:46px;font-weight:800;line-height:1.3;letter-spacing:-.6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{margin-top:14px;font-size:26px;color:var(--sub);line-height:1.5}
.rmeta .v{color:var(--ink);font-weight:700}
.pill{display:inline-block;font-size:23px;font-weight:800;padding:7px 20px;border-radius:30px;
      margin-bottom:16px;letter-spacing:.04em}
.pill.p0{background:var(--hot);color:#fff}
.pill.p1{background:var(--warn);color:#231a08}
.pill.p2{background:transparent;color:var(--cool);border:2px solid var(--cool)}
.pfoot{display:flex;justify-content:space-between;align-items:center;
       padding-top:24px;border-top:1px solid var(--line);font-size:23px;color:var(--kick);
       letter-spacing:.1em;font-variant-numeric:tabular-nums}

/* 尾页 */
.end{justify-content:center}
.end .big{font-family:"Songti SC","SimSun",Georgia,serif;font-size:96px;font-weight:800;
          line-height:1.2;letter-spacing:-2px}
.end .big em{font-style:normal;color:var(--hot)}
.end p{margin-top:40px;font-size:30px;line-height:1.85;color:var(--sub);max-width:820px}
.end .src{margin-top:56px;padding-top:34px;border-top:3px solid var(--ink);font-size:25px;
          color:var(--sub);line-height:2}
.end .src b{color:var(--ink)}
.note{margin-top:34px;font-size:24px;color:var(--hot);font-weight:700;line-height:1.6}

/* 各模板微调 */
body.tpl-list .pg{padding:var(--pad) var(--pad) 56px}
body.tpl-list .phead{border-bottom:none;background:#141414;color:#fff;
     margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;padding:44px var(--pad) 40px}
body.tpl-list .phead .r{color:#9b9b9b}
body.tpl-list .row{padding:26px 0}
body.tpl-list .rt{font-size:36px}
body.tpl-list .idx{width:74px;font-size:38px;font-family:inherit;color:#c9c9c9}
body.tpl-list .rmeta{font-size:22px;margin-top:10px}
body.tpl-list .pill{font-size:20px;padding:5px 16px;margin-bottom:12px}
body.tpl-list .cv h1{font-size:120px}
body.tpl-list .cv .sub{font-size:32px}
body.tpl-list .peek .pt{font-size:29px}
body.tpl-dy .row{padding:44px 0}
body.tpl-dy .rt{font-size:56px}
body.tpl-dy .rmeta{font-size:30px}
body.tpl-dy .idx{font-size:62px;width:110px}
body.tpl-dy .pill{font-size:26px;padding:9px 24px}
body.tpl-dy .phead .l{font-size:38px}
body.tpl-dy .cv h1{font-size:172px}
body.tpl-dy .cv .sub{font-size:42px}
body.tpl-dy .cv .n b{font-size:84px}
body.tpl-dy .cv .n span{font-size:26px}
body.tpl-dy .peek .pt{font-size:33px}
body.tpl-dy .cv .rule{background:var(--cool);opacity:1}

/* 加载 / 出错 */
#state{width:100%;min-height:60vh;display:flex;flex-direction:column;gap:16px;
       align-items:center;justify-content:center;font-size:15px;color:#6f6757;
       line-height:1.9;text-align:center;padding:40px}
#state .big{font-size:19px;font-weight:700;color:#221f19}
#state code{background:#f3efe6;padding:3px 8px;border-radius:5px;font-size:13px;color:#8a5a1e}
#state a{color:#39707c}

/* 工具栏（clean=1 时隐藏） */
#bar{position:fixed;left:0;right:0;bottom:0;background:#1b1915;color:#e9e4d8;
     display:flex;gap:12px;align-items:center;padding:11px 20px;font-size:13px;
     font-family:"Microsoft YaHei",sans-serif;z-index:99;flex-wrap:wrap}
#bar b{color:#f0c05a;letter-spacing:.05em}
#bar a{background:#2f2b25;color:#e9e4d8;border:1px solid #46403a;border-radius:8px;
     padding:6px 12px;font-size:13px;text-decoration:none}
#bar a.cur{background:#f0c05a;color:#1b1915;border-color:#f0c05a;font-weight:700}
#bar .sp{flex:1}
#bar .hint{color:#8a8272}
body.clean #bar{display:none}
body.clean .pg{transform:none!important}
</style></head><body><div id="stage"><div id="state"><div class="big">正在读取最新数据…</div><div>data.json</div></div></div><script>
(function(){
  var T = {
    xhs:  {w:1080,h:1440,per:4,label:'小红书 3:4'},
    dy:   {w:1080,h:1920,per:4,label:'抖音 9:16'},
    list: {w:1080,h:1440,per:5,label:'清单 3:4'}
  };
  var MAXP = 9;
  var q = new URLSearchParams(location.search);
  var tpl = T[q.get('tpl')] ? q.get('tpl') : 'xhs';
  var clean = q.get('clean') === '1';
  var all = q.get('all') === '1';
  var p = parseInt(q.get('p') || '1', 10);
  var src = q.get('src') || 'data.json';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hostOf(it){
    var u = it.link_vendor || it.link_source || '';
    try { var h = new URL(u).hostname; return h.replace(/^www\./,''); } catch(e){ return ''; }
  }
  function tier(it){
    var d = it.days_left;
    if (d === null || d === undefined) return 2;
    if (d <= 0) return 0;
    if (d === 1) return 1;
    return 2;
  }
  function dshort(it){
    var d = it.days_left;
    if (d === null || d === undefined) return '长期';
    if (d <= 0) return '今天';
    return '剩 ' + d + ' 天';
  }
  function collect(d){
    var b = [[],[],[]], seen = {};
    (d.expiring || []).forEach(function(it){
      var k = it.key || it.title;
      if (seen[k]) return; seen[k] = 1; b[tier(it)].push(it);
    });
    var extra = (d.new_deals || []).concat(d.new_resources || []).filter(function(it){
      var k = it.key || it.title;
      if (seen[k]) return false; seen[k] = 1; return true;
    });
    return b[0].concat(b[1], extra, b[2]);
  }
  function chunkPages(items, per){
    var room = (MAXP - 2) * per;
    var omitted = Math.max(0, items.length - room);
    var shown = items.slice(0, room);
    var pages = [{kind:'cover'}];
    for (var i = 0; i < shown.length; i += per){
      pages.push({kind:'items', items: shown.slice(i, i + per), start: i});
    }
    pages.push({kind:'end', omitted: omitted});
    return pages;
  }
  function labelOf(items){
    var known = items.map(function(x){return x.days_left}).filter(function(d){
      return d !== null && d !== undefined;
    });
    if (known.some(function(d){return d === 0;})) return '今天截止';
    if (known.some(function(d){return d === 1;})) return '48 小时内截止';
    if (known.length) return '三天内截止';
    return '值得一看';
  }
  function pillOf(it){
    var d = it.days_left;
    if (d === null || d === undefined) return '<span class="pill p2">长期有效</span>';
    if (d <= 0) return '<span class="pill p0">今天截止</span>';
    if (d === 1) return '<span class="pill p1">剩 1 天</span>';
    return '<span class="pill p2">剩 ' + d + ' 天</span>';
  }

  function cover(d, peek){
    var c = d.counts || {}, exp = d.expiring || [];
    var n0 = exp.filter(function(x){return x.days_left === 0}).length;
    var n1 = exp.filter(function(x){return x.days_left === 1}).length;
    var n2 = exp.filter(function(x){return x.days_left >= 2}).length;
    var date = String(d.generated_date || '');
    var ds = date ? date.slice(5).replace('-', ' / ') : '';
    var rows = peek.map(function(it){
      return '<div class="pi"><span class="pk">' + esc(dshort(it)) + '</span>' +
             '<span class="pt">' + esc(it.title) + '</span>' +
             '<span class="pd">' + esc(hostOf(it)) + '</span></div>';
    }).join('');
    return '<section class="pg cv">' +
      '<div class="top"><span>AI DEAL RADAR</span><span>' + esc(ds) + '</span></div>' +
      '<div class="mid"><h1>AI 优惠<em>雷达</em></h1>' +
      '<div class="sub">今天截止 <b>' + n0 + '</b> 个、两天内 <b>' + (n0 + n1) + '</b> 个。<br>' +
      '免费额度与限时折扣，挑还来得及的看。</div>' +
      '<div class="rule"></div><div class="nums">' +
      '<div class="n h"><b>' + n0 + '</b><span>今天截止</span></div>' +
      '<div class="n w"><b>' + n1 + '</b><span>剩 1 天</span></div>' +
      '<div class="n c"><b>' + n2 + '</b><span>剩 2 天以上</span></div>' +
      '</div></div>' +
      '<div class="peek"><div class="ph">今日速览</div>' + rows + '</div>' +
      '<div class="bot"><span>在架 ' + (c.total || 0) + ' 条 · 每日更新</span>' +
      '<span>yutao8.github.io/ai-deal-radar</span></div></section>';
  }

  function itemsPage(pg, no, total, d){
    var rows = pg.items.map(function(it, i){
      var bits = [it.cat, hostOf(it)].filter(Boolean);
      var meta = bits.map(function(b, k){
        return k === 1 ? '<span class="v">' + esc(b) + '</span>' : esc(b);
      }).join(' · ');
      return '<div class="row"><div class="idx">' + ('0' + (pg.start + i + 1)).slice(-2) +
        '</div><div class="rmain">' + pillOf(it) +
        '<div class="rt">' + esc(it.title) + '</div>' +
        '<div class="rmeta">' + meta + '</div></div></div>';
    }).join('');
    return '<section class="pg"><div class="phead"><span class="l">' + esc(labelOf(pg.items)) +
      '</span><span class="r">' + ('0' + no).slice(-2) + ' / ' + ('0' + total).slice(-2) +
      '</span></div><div class="list">' + rows + '</div>' +
      '<div class="pfoot"><span>AI 优惠雷达</span><span>' +
      esc(d.generated_date || '') + '</span></div></section>';
  }

  function endPage(pg, d){
    var note = pg.omitted ? '<div class="note">另有 ' + pg.omitted +
      ' 条未上图，完整清单见站点</div>' : '';
    return '<section class="pg end"><div class="big">每天 <em>07:00</em><br>自动更新</div>' +
      '<p>七个来源抓取，跨站去重后才上榜。<br>链接里的推荐码与追踪参数全部剥掉，点进去就是厂商原页。</p>' +
      note +
      '<div class="src"><b>数据源</b>　AI价格雷达 / apiprice / DevTk / Token FBI / TokenTab / ' +
      'ai-coding-welfare / FreeLLM-API-KeyHub<br>' +
      '<b>站点</b>　yutao8.github.io/ai-deal-radar<br>' +
      '<b>快照</b>　' + esc(d.generated_at || '') + '</div></section>';
  }

  function bar(n, total){
    function link(t, extra){
      var s = '?tpl=' + t + '&p=1' + (clean ? '&clean=1' : '');
      return '<a class="' + (t === tpl ? 'cur' : '') + '" href="' + s + '">' + extra + '</a>';
    }
    return '<div id="bar"><b>分页预览</b>' +
      '<a href="index.html">← 回列表</a>' +
      link('xhs','小红书') + link('dy','抖音') + link('list','清单') +
      '<a href="?tpl=' + tpl + '&all=1">全部页</a>' +
      '<span class="sp"></span>' +
      '<span>页码 <b id="hud">' + (all ? '全部' : (n + ' / ' + total)) + '</b></span>' +
      '<span class="hint">← → 翻页</span>' +
      '<a href="?tpl=' + tpl + '&p=' + n + '&clean=1">截图模式</a></div>';
  }

  function fail(msg){
    document.getElementById('stage').innerHTML =
      '<div id="state"><div class="big">数据还没到</div>' +
      '<div>' + esc(msg) + '</div>' +
      '<div>用 <code>file://</code> 直接打开会被浏览器拦截跨域请求，' +
      '请改用站点地址，或在 docs 目录起一个本地服务：<br>' +
      '<code>python -m http.server 8000</code> 然后访问 ' +
      '<a href="http://localhost:8000/poster.html">localhost:8000/poster.html</a></div></div>';
  }

  function boot(){
    document.body.className = 'tpl-' + tpl + (clean ? ' clean' : '') + (all ? ' all' : '');
    var url = src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    fetch(url, {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){
        var cfg = T[tpl];
        var pages = chunkPages(collect(d), cfg.per);
        var total = pages.length;
        var html = pages.map(function(pg, i){
          if (pg.kind === 'cover') return cover(d, collect(d).slice(0, 3));
          if (pg.kind === 'items') return itemsPage(pg, i + 1, total, d);
          return endPage(pg, d);
        }).join('');
        var stage = document.getElementById('stage');
        stage.innerHTML = html;
        document.body.insertAdjacentHTML('beforeend', bar(1, total));
        var els = [].slice.call(stage.querySelectorAll('.pg'));
        if (all){
          els.forEach(function(el){ el.classList.add('on'); });
        } else {
          if (isNaN(p) || p < 1) p = 1;
          if (p > total) p = total;
          els[p - 1].classList.add('on');
          var hud = document.getElementById('hud');
          if (hud) hud.textContent = p + ' / ' + total;
          fit();
        }
        if (!clean && !all){
          window.addEventListener('resize', fit);
          document.addEventListener('keydown', function(e){
            var np = p;
            if (e.key === 'ArrowRight') np = p + 1;
            if (e.key === 'ArrowLeft') np = p - 1;
            if (np !== p && np >= 1 && np <= total){
              location.search = '?tpl=' + tpl + '&p=' + np;
            }
          });
        }
      })
      .catch(function(e){ fail('读取 data.json 失败：' + e.message); });
  }

  function fit(){
    var pg = document.querySelector('.pg.on');
    if (!pg) return;
    var s = Math.min(1, (window.innerHeight - 150) / pg.offsetHeight,
                       (window.innerWidth - 60) / pg.offsetWidth);
    [].forEach.call(document.querySelectorAll('.pg'), function(el){
      el.style.transform = 'scale(' + s + ')';
    });
  }

  boot();
})();
</script></body></html>
